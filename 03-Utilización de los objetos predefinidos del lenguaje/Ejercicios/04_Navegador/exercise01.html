<!doctype html>
<!--
  Crea el objeto `info` con:
    - `host` y `path`: de `location`.
    - `language` y `online`: de `navigator`.
    - `screen`: tamaño de la pantalla ("ancho x alto", con `screen`).
    - `viewport`: tamaño del área visible ("ancho x alto", con `window`).

  Resultado esperado:
    Un objeto en la consola con los seis datos.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Browser info</title>
</head>
<body>
  <h1>Open the console</h1>

  <script>
    const info = {
      host: location.host,
      path: location.pathname,
      language: navigator.language,
      online: navigator.onLine,
      screen: `${screen.width} x ${screen.height}`,
      viewport: `${window.innerWidth} x ${window.innerHeight}`,
    };

    console.table(info);
  </script>
</body>
</html>
