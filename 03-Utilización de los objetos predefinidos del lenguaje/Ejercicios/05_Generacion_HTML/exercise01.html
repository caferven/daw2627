<!doctype html>
<!--
  Genera una tabla de productos y añádela al `body`:
    - Una fila de cabecera con una celda "th" por cada texto de `headers`.
    - Una fila por producto con dos celdas "td": el nombre y el precio, con 2
      decimales y "€".

  Resultado esperado:
    Product   Price
    Keyboard  49.90 €
    Mouse     19.50 €
    Monitor   189.00 €
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Products</title>
</head>
<body>
  <h1>Products</h1>

  <script>
    const headers = ["Product", "Price"];
    const products = [
      { name: "Keyboard", price: 49.9 },
      { name: "Mouse", price: 19.5 },
      { name: "Monitor", price: 189 },
    ];

    const table = document.createElement("table");

    const headerRow = document.createElement("tr");
    for (let i = 0; i < headers.length; i++) {
      const cell = document.createElement("th");
      cell.textContent = headers[i];
      headerRow.append(cell);
    }
    table.append(headerRow);

    for (let i = 0; i < products.length; i++) {
      const product = products[i];
      const row = document.createElement("tr");

      const nameCell = document.createElement("td");
      nameCell.textContent = product.name;
      row.append(nameCell);

      const priceCell = document.createElement("td");
      priceCell.textContent = `${product.price} €`;
      row.append(priceCell);

      table.append(row);
    }

    document.body.append(table);
  </script>
</body>
</html>
