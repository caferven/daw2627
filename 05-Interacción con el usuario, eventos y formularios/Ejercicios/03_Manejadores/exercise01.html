<!doctype html>
<!--
  El script está en el <head>: se ejecuta antes de que exista el botón.
  Dentro de `DOMContentLoaded`, registra un clic en el botón `info` que muestre
  en `output` los datos del objeto event:
    "type: click, target: info, x: <clientX>, y: <clientY>"
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Event object</title>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const info = document.querySelector("#info");
      const output = document.querySelector("#output");

      info.addEventListener("click", (e) => {
        output.textContent =
          `type: ${e.type}, target: ${e.target.id}, x: ${e.clientX}, y: ${e.clientY}`;
      });
    });
  </script>
</head>
<body>
  <button id="info">Show event info</button>
  <p id="output"></p>
</body>
</html>
